<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orakel</title>
<meta name="theme-color" content="#1c0f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orakel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* ---------- Farben: warmes Licht für einen Abend mit Freunden ---------- */
  :root {
    color-scheme: dark;
    --bg: #1c0f17;
    --bg2: #12090f;
    --card: #2a1722;
    --line: #4a2c3d;
    --text: #fff3ea;
    --muted: #cfa9a8;
    --amber: #ffb547;
    --amber-hell: #ffd27a;
    --koralle: #ff7a59;
    --pink: #ff6f9f;
    --gold: #ffd166;
    --auf-amber: #2b1208;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  [hidden] { display: none !important; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(70% 45% at 10% 0%, rgba(255, 140, 60, .22), transparent 70%),
      radial-gradient(60% 40% at 95% 5%, rgba(255, 90, 150, .16), transparent 70%),
      linear-gradient(180deg, #24121c 0%, var(--bg) 45%, var(--bg2) 100%);
    background-attachment: fixed;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px);
    -webkit-tap-highlight-color: transparent;
  }

  main { max-width: 480px; margin: 0 auto; }
  section { display: flex; flex-direction: column; gap: 14px; }

  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------- Sprachumschalter ---------- */
  .sprache-wahl { display: inline-flex; gap: 2px; padding: 3px; border-radius: 99px; background: rgba(255, 255, 255, .07); flex: none; }
  .sprache-wahl button { background: none; color: var(--muted); padding: 6px 11px; border-radius: 99px; font-size: 13px; font-weight: 800; }
  .sprache-wahl button[aria-pressed="true"] { background: var(--amber); color: var(--auf-amber); }

  /* ---------- Startseite ---------- */
  .logo { text-align: center; padding: 4px 0 2px; position: relative; }
  /* z-index, damit die schwebende Kugel die Knöpfe nicht verdeckt */
  .logo .sprache-wahl { position: absolute; top: 0; right: 0; z-index: 2; }
  .kugel { font-size: 64px; line-height: 1; filter: drop-shadow(0 0 22px rgba(255, 150, 80, .6)); animation: schweben 4s ease-in-out infinite; }
  h1 {
    margin: 8px 0 2px; font-size: 38px; font-weight: 900; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--amber-hell), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .untertitel { margin: 0; color: var(--muted); }

  .karte { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .feld-titel { display: block; font-size: 13px; font-weight: 800; color: var(--muted); margin: 20px 0 8px; }
  .karte > .feld-titel:first-child { margin-top: 0; }

  .reihe { display: flex; gap: 8px; }
  #raumFeld {
    flex: 1; min-width: 0; font: inherit; font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text);
  }
  #raumFeld::placeholder { letter-spacing: normal; font-weight: 500; text-transform: none; color: #8a6c70; }

  .zweit { background: rgba(255, 255, 255, .08); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
  .zweit:disabled { opacity: .35; cursor: default; }
  .wuerfel { font-size: 20px; padding: 0 14px; }

  .zaehler { display: flex; align-items: center; gap: 18px; }
  .rund { width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 22px; }
  #anzahl { font-size: 28px; font-weight: 900; min-width: 36px; text-align: center; }

  .nummern { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .nummern button { aspect-ratio: 1; border-radius: 12px; background: rgba(255, 255, 255, .07); font-size: 18px; font-weight: 800; border: 2px solid transparent; padding: 0; }
  .nummern button[aria-pressed="true"] { background: rgba(255, 181, 71, .2); border-color: var(--amber); }

  .haupt {
    background: linear-gradient(135deg, var(--amber-hell), var(--koralle)); color: var(--auf-amber);
    font-weight: 800; font-size: 17px; padding: 15px 18px; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(255, 122, 89, .3); transition: transform .1s;
  }
  .haupt:active { transform: scale(.98); }
  .haupt.sicher { background: linear-gradient(135deg, var(--pink), #d93a64); color: #fff; box-shadow: 0 8px 24px rgba(217, 58, 100, .35); }
  .breit { width: 100%; }
  .karte .breit { margin-top: 22px; }
  .fehler { color: #ffb3c4; margin: 10px 0 0; font-size: 14px; }
  .wackeln { animation: wackeln .35s; }

  /* Einstellungen und Regeln */
  details summary { font-weight: 800; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "▾"; color: var(--muted); transition: transform .2s; }
  details[open] summary::after { transform: rotate(180deg); }
  .zusammenfassung { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--amber-hell); text-align: right; }

  .themen { display: flex; flex-wrap: wrap; gap: 6px; }
  .themen button { background: rgba(255, 255, 255, .06); padding: 8px 12px; border-radius: 99px; font-size: 14px; font-weight: 600; border: 1.5px solid transparent; }
  .themen button[aria-pressed="true"] { background: rgba(255, 181, 71, .18); border-color: var(--amber); }

  .schalter-zeile { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0 0; margin-top: 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .schalter-zeile b { display: block; font-size: 15px; }
  .schalter-zeile small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.35; }
  input[role="switch"] {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
    width: 50px; height: 30px; border-radius: 99px; background: rgba(255, 255, 255, .16); position: relative; transition: background .2s;
  }
  input[role="switch"]::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: transform .2s;
  }
  input[role="switch"]:checked { background: var(--koralle); }
  input[role="switch"]:checked::after { transform: translateX(20px); }
  input[role="switch"]:disabled { opacity: .35; cursor: default; }
  .hinweis-box { margin: 16px 0 0; font-size: 13px; color: var(--muted); background: rgba(255, 255, 255, .04); border-radius: 10px; padding: 10px 12px; line-height: 1.4; }

  .regeln ol { margin: 12px 0 0; padding-left: 20px; line-height: 1.5; color: #f1d9d2; }
  .regeln li + li { margin-top: 6px; }

  /* ---------- Spielseite ---------- */
  .spiel-kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .raum-name { font-weight: 900; font-size: 18px; overflow-wrap: anywhere; }
  .klein { font-size: 12.5px; color: var(--muted); }
  .kontroll { text-align: right; flex: none; }
  .kontroll-wort { font-weight: 900; color: var(--gold); letter-spacing: .06em; font-size: 16px; }

  .runden-leiste { display: flex; align-items: center; justify-content: center; gap: 16px; font-weight: 800; font-size: 18px; }
  .klein-knopf { width: 36px; height: 36px; font-size: 20px; }

  .spielkarte {
    width: 100%; min-height: 260px; border-radius: 22px; padding: 26px 22px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    background: linear-gradient(160deg, #4a2232, var(--card) 70%);
    border: 1.5px solid rgba(255, 181, 71, .35); box-shadow: 0 0 40px rgba(255, 120, 80, .2);
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    transition: transform .12s, border-color .12s;
  }
  .spielkarte.offen { transform: scale(.985); border-color: var(--amber); }
  .spielkarte .offen-inhalt { display: none; }
  .spielkarte.offen .offen-inhalt { display: flex; flex-direction: column; gap: 14px; }
  .spielkarte.offen .verdeckt-inhalt { display: none; }
  .verdeckt-inhalt { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
  .gross-symbol { font-size: 46px; line-height: 1; }
  .verdeckt-inhalt small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .karte-gross { font-size: 23px; font-weight: 800; line-height: 1.35; }
  .karte-klein { font-size: 16px; color: var(--amber-hell); font-weight: 700; line-height: 1.4; }

  .beginner { text-align: center; margin: 0; color: #f1d9d2; font-weight: 600; }

  .knopf-reihe { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }

  .aufloesung { text-align: center; animation: aufdecken .4s ease-out; }
  .orakel-name { font-size: 28px; font-weight: 900; color: var(--pink); margin: 2px 0 12px; }
  .letzte-chance {
    background: rgba(255, 111, 159, .12); border: 1px dashed rgba(255, 111, 159, .5); border-radius: 12px;
    padding: 10px 12px; color: #ffd6e4; font-weight: 600; line-height: 1.4;
  }
  .trenner { height: 1px; background: var(--line); margin: 14px 0 12px; }
  .frage { font-weight: 700; margin: 4px 0 12px; line-height: 1.35; }
  .antwort { font-size: 24px; font-weight: 900; color: var(--gold); margin-top: 2px; }
  #frageTeil { animation: aufdecken .4s ease-out; }

  .fuss { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
  .text-knopf { background: none; color: var(--muted); font-size: 14px; padding: 8px 4px; text-decoration: underline; }

  /* ---------- Diskussions-Timer ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px;
    background: rgba(14, 6, 10, .88); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    animation: einblenden .2s;
  }
  .overlay-box { width: 100%; max-width: 340px; text-align: center; }
  .timer-ring {
    --p: 1; --ring: var(--amber);
    width: 210px; height: 210px; border-radius: 50%; margin: 0 auto; position: relative; display: grid; place-items: center;
    background: conic-gradient(var(--ring) calc(var(--p) * 360deg), rgba(255, 255, 255, .08) 0);
    box-shadow: 0 0 50px rgba(255, 140, 70, .25);
  }
  .timer-ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--card); }
  .timer-ring.knapp { --ring: var(--pink); }
  #timerZahl { position: relative; font-size: 72px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #timerZahl.plopp { animation: plopp .5s cubic-bezier(.2, 1.6, .4, 1); }
  .timer-text { font-size: 21px; font-weight: 800; margin: 22px 0 22px; line-height: 1.3; }
  .overlay.finale .timer-text { font-size: 30px; color: var(--amber-hell); }
  .overlay.finale .timer-ring { --ring: var(--pink); box-shadow: 0 0 70px rgba(255, 111, 159, .5); }
  .overlay.finale #timerZahl { font-size: 88px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: #0d0609; border: 1px solid var(--line); padding: 10px 16px; border-radius: 99px;
    font-weight: 700; font-size: 14px; z-index: 70; white-space: nowrap; animation: aufdecken .25s;
  }

  @keyframes schweben { 50% { transform: translateY(-6px); } }
  @keyframes aufdecken { from { opacity: 0; transform: scale(.96); } }
  @keyframes einblenden { from { opacity: 0; } }
  @keyframes plopp { from { transform: scale(.4); opacity: 0; } }
  @keyframes wackeln { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <!-- ================= Startseite ================= -->
  <section id="startSeite">
    <header class="logo">
      <div class="sprache-wahl" role="group" aria-label="Sprache / Language">
        <button type="button" data-sprache="de" aria-label="Deutsch">DE</button>
        <button type="button" data-sprache="en" aria-label="English">EN</button>
      </div>
      <div class="kugel" aria-hidden="true">🔮</div>
      <h1 data-t="titel">Orakel</h1>
      <p class="untertitel" data-t="untertitel"></p>
    </header>

    <div class="karte">
      <label class="feld-titel" for="raumFeld" data-t="raumLabel"></label>
      <div class="reihe">
        <input id="raumFeld" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" data-t-placeholder="raumPlatzhalter">
        <button class="zweit wuerfel" id="raumZufall" type="button" data-t-aria="raumZufall">🎲</button>
      </div>

      <div class="feld-titel" data-t="anzahlTitel"></div>
      <div class="zaehler">
        <button class="zweit rund" id="weniger" type="button" data-t-aria="weniger">−</button>
        <span id="anzahl" aria-live="polite">4</span>
        <button class="zweit rund" id="mehr" type="button" data-t-aria="mehr">+</button>
      </div>

      <div class="feld-titel" data-t="nummerTitel"></div>
      <div class="nummern" id="nummern" role="group" data-t-aria="nummerTitel"></div>

      <button class="haupt breit" id="starten" type="button" data-t="starten"></button>
      <p class="fehler" id="startFehler" hidden></p>
    </div>

    <details class="karte" id="einstellungen">
      <summary><span data-t="einstellungen"></span> <span class="zusammenfassung" id="einstZusammenfassung"></span></summary>

      <div class="feld-titel" data-t="themenTitel"></div>
      <div class="themen" id="themen" role="group" data-t-aria="themenTitel"></div>

      <label class="schalter-zeile">
        <span><b data-t="hinweisTitel"></b><small data-t="hinweisText"></small></span>
        <input type="checkbox" role="switch" id="hinweisSchalter">
      </label>

      <label class="schalter-zeile">
        <span><b data-t="zweiTitel"></b><small id="zweiText"></small></span>
        <input type="checkbox" role="switch" id="zweiSchalter">
      </label>

      <p class="hinweis-box" data-t="einstHinweis"></p>
    </details>

    <details class="karte regeln">
      <summary data-t="regelnTitel"></summary>
      <ol data-t-html="regeln"></ol>
    </details>
  </section>

  <!-- ================= Spielseite ================= -->
  <section id="spielSeite" hidden>
    <div class="spiel-kopf">
      <div>
        <div class="raum-name" id="raumAnzeige"></div>
        <div class="klein" id="spielerAnzeige"></div>
      </div>
      <div class="kontroll">
        <div class="klein" data-t="kontrollwort"></div>
        <div class="kontroll-wort" id="kontrollwort"></div>
      </div>
    </div>

    <div class="runden-leiste">
      <button class="zweit rund klein-knopf" id="rundeZurueck" data-t-aria="rundeZurueck">‹</button>
      <span id="rundeAnzeige"></span>
      <button class="zweit rund klein-knopf" id="rundeVor" data-t-aria="rundeVor">›</button>
    </div>

    <button class="spielkarte" id="spielkarte" type="button" data-t-aria="karteAria">
      <span class="verdeckt-inhalt">
        <span class="gross-symbol" aria-hidden="true">🔮</span>
        <span data-t="karteHalten"></span>
        <small data-t="karteLoslassen"></small>
      </span>
      <span class="offen-inhalt">
        <span class="karte-gross" id="karteText"></span>
        <span class="karte-klein" id="karteHinweis"></span>
      </span>
    </button>

    <p class="beginner" id="beginner"></p>

    <div class="karte aufloesung" id="aufloesung" hidden>
      <div class="klein" id="orakelLabel"></div>
      <div class="orakel-name" id="orakelName"></div>
      <div class="letzte-chance" id="letzteChance"></div>
      <div id="frageTeil" hidden>
        <div class="trenner"></div>
        <div class="klein" data-t="frageWar"></div>
        <div class="frage" id="aufFrage"></div>
        <div class="klein" data-t="richtigeAntwort"></div>
        <div class="antwort" id="aufAntwort"></div>
      </div>
    </div>

    <div class="knopf-reihe" id="rundenKnoepfe">
      <button class="zweit" id="diskussion" type="button" data-t="diskussion"></button>
      <button class="haupt" id="aufloesen" type="button"></button>
    </div>
    <button class="haupt breit" id="frageZeigen" type="button" data-t="frageZeigen" hidden></button>
    <button class="haupt breit" id="naechste" type="button" data-t="naechste" hidden></button>

    <div class="fuss">
      <button class="text-knopf" id="einladen" type="button" data-t="einladen"></button>
      <div class="sprache-wahl" role="group" aria-label="Sprache / Language">
        <button type="button" data-sprache="de" aria-label="Deutsch">DE</button>
        <button type="button" data-sprache="en" aria-label="English">EN</button>
      </div>
      <button class="text-knopf" id="verlassen" type="button" data-t="verlassen"></button>
    </div>
  </section>
</main>

<!-- Diskussions-Timer -->
<div class="overlay" id="timer" hidden>
  <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="timerText">
    <div class="timer-ring" id="timerRing"><span id="timerZahl" aria-live="off">60</span></div>
    <p class="timer-text" id="timerText" aria-live="assertive"></p>
    <div class="knopf-reihe" id="timerKnoepfe">
      <button class="zweit" id="timerAbbrechen" type="button" data-t="abbrechen"></button>
      <button class="haupt" id="timerJetzt" type="button" data-t="jetztZeigen"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- Die Zahl hinter v= bei jeder Änderung an fragen.js um 1 erhöhen, damit Handys die neue Datei laden -->
<script src="fragen.js?v=2"></script>
<script>
// =====================================================================
// Orakel: Alle Handys rechnen mit derselben Zufallsformel.
// Gleicher Raum-Code + gleiche Spielerzahl + gleiche Einstellungen + gleiche Runde
// = gleiche Frage und gleiches Orakel auf jedem Handy, ganz ohne Server.
// Die Sprache ist dabei egal: Jeder kann Deutsch oder Englisch wählen.
// =====================================================================

// ---------- Alle Texte auf Deutsch und Englisch ----------
const TEXTE = {
  de: {
    titel: "Orakel",
    untertitel: "Wer kennt die Frage nicht?",
    raumLabel: "Raum-Code",
    raumPlatzhalter: "z. B. PIZZA",
    raumZufall: "Zufälligen Code erzeugen",
    anzahlTitel: "Wie viele spielen mit?",
    weniger: "Weniger Spieler",
    mehr: "Mehr Spieler",
    nummerTitel: "Welche Nummer bist du?",
    starten: "Spiel starten",
    startFehler: "Gib zuerst einen Raum-Code ein oder würfle einen mit 🎲.",
    einstellungen: "Einstellungen",
    themenTitel: "Themen",
    hinweisTitel: "Themen-Hinweis fürs Orakel",
    hinweisText: "Das Orakel erfährt, um welches Thema es geht. So wird Bluffen leichter.",
    zweiTitel: "Zwei Orakel",
    zweiErstAb7: "Erst ab 7 Spielern möglich.",
    zweiWissenNichts: "Die beiden wissen nichts voneinander.",
    einstHinweis: "Alle müssen dieselben Einstellungen wählen. Das Kontrollwort im Spiel prüft das automatisch mit. Die Sprache darf jeder selbst wählen.",
    alleThemen: "Alle Themen",
    anzahlThemen: (w) => `${w.n} ${w.n === 1 ? "Thema" : "Themen"}`,
    mitHinweis: "Hinweis",
    zweiOrakelKurz: "2 Orakel",
    mindestensEinThema: "Mindestens ein Thema muss an bleiben",
    regelnTitel: "So wird gespielt",
    regeln: `
      <li>Alle geben <b>denselben Raum-Code</b>, <b>dieselbe Spielerzahl</b> und dieselben Einstellungen ein. Jeder wählt eine <b>andere Nummer</b>. Setzt euch am besten in der Reihenfolge eurer Nummern hin.</li>
      <li>Vergleicht das <b>Kontrollwort</b> oben rechts. Steht bei allen dasselbe Wort, seid ihr im selben Spiel.</li>
      <li><b>Halte deine Karte gedrückt</b>, um sie heimlich zu lesen. Alle bekommen dieselbe Schätzfrage, nur einer nicht: das <b>Orakel</b>. Es kennt nur die Einheit.</li>
      <li>Reihum sagt jeder laut seine Schätzung. Das Orakel muss bluffen, ohne sich zu verraten.</li>
      <li>Tippt auf <b>⏱ Diskussion</b>. Nach 60 Sekunden zählt das Handy runter, und bei „Zeigt aufs Orakel!“ zeigen alle gleichzeitig auf das Orakel.</li>
      <li>Tippt auf <b>Auflösen</b>. Das Orakel hat eine <b>letzte Chance</b>: Es darf laut raten, wie die Frage lautete. Erst dann wird sie gezeigt.</li>
      <li>Zum Schluss tippen alle auf <b>Nächste Runde</b>.</li>`,
    kontrollwort: "Kontrollwort",
    raum: (w) => `Raum ${w.raum}`,
    spielerVon: (w) => `Du bist Spieler ${w.n} von ${w.m}`,
    runde: (w) => `Runde ${w.r}`,
    rundeZurueck: "Eine Runde zurück",
    rundeVor: "Eine Runde vor",

function t(schluessel, werte = {}) {
  const text = (TEXTE[stand.sprache] || TEXTE.de)[schluessel] ?? TEXTE.de[schluessel] ?? schluessel;
  return typeof text === "function" ? text(werte) : text;
}

// Frage in der gewählten Sprache
function frageIn(q) {
  return stand.sprache === "en" && q.en ? { f: q.en[0], e: q.en[1], a: q.en[2] } : { f: q.f, e: q.e, a: q.a };
}
const themaName = (id) => (stand.sprache === "en" ? THEMEN[id].en : THEMEN[id].name);
const themaHinweis = (id) => (stand.sprache === "en" ? THEMEN[id].hinweisEn : THEMEN[id].hinweis);

// ---------- Grundeinstellungen ----------
const SPEICHER = "orakel-v1";
const DISKUSSION_SEKUNDEN = 60;
const THEMEN_IDS = Object.keys(THEMEN);
// Kontrollwörter, die auf Deutsch und Englisch gleich sind, damit gemischte Gruppen vergleichen können
const WOERTER = [
  "TIGER", "PANDA", "PIZZA", "TACO", "KIWI", "MANGO", "ZEBRA", "KOALA", "GORILLA", "FLAMINGO",
  "JAGUAR", "HAMSTER", "PONY", "TORNADO", "OPAL", "MOTOR", "TURBO", "NINJA", "PIXEL", "SAMBA",
  "TANGO", "POLKA", "LIMBO", "BINGO", "DOMINO", "COWBOY", "CELLO", "BANJO", "PIANO", "SAFARI",
  "HOTEL", "TAXI", "SOFA", "RADIO", "VIDEO", "ALBUM", "SNACK", "TOAST", "MUFFIN", "PUDDING",
  "POPCORN", "KETCHUP", "ESPRESSO", "MOJITO", "NACHO", "BURRITO", "PAPRIKA", "CHILI", "PAPAYA", "DISCO",
];

const $ = (s) => document.querySelector(s);

// ---------- Zufallsformel (auf jedem Handy gleich) ----------
function hash(text) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  // Nur 53 Bit verwenden, sonst rundet JavaScript die letzten Stellen weg
  return (h2 & 2097151) * 4294967296 + (h1 >>> 0);
}

function zufallsfolge(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Einstellungen ----------
function aktiveThemen() {
  const gewaehlt = (stand.themen || []).filter((x) => THEMEN_IDS.includes(x));
  return gewaehlt.length ? gewaehlt : THEMEN_IDS;
}
function themenSchluessel() {
  const a = aktiveThemen();
  return a.length === THEMEN_IDS.length ? "alle" : [...a].sort().join(",");
}
const zweiAktiv = () => stand.zweiOrakel && stand.anzahl >= 7;

// Pro Raum und Themenauswahl werden die Fragen einmal gemischt, damit sich nichts wiederholt
let reihenfolgeCache = { schluessel: null, liste: [] };
function fragenReihenfolge() {
  const schluessel = stand.raum + "|" + themenSchluessel();
  if (reihenfolgeCache.schluessel === schluessel) return reihenfolgeCache.liste;
  const themen = aktiveThemen();
  const liste = [];
  FRAGEN.forEach((q, i) => { if (themen.includes(q.t)) liste.push(i); });
  const zufall = zufallsfolge(hash(schluessel + "|fragen") % 4294967296);
  for (let i = liste.length - 1; i > 0; i--) {
    const j = Math.floor(zufall() * (i + 1));
    [liste[i], liste[j]] = [liste[j], liste[i]];
  }
  reihenfolgeCache = { schluessel, liste };
  return liste;
}

function rundeDaten() {
  const { raum, anzahl, runde } = stand;
  const liste = fragenReihenfolge();
  const basis = `${raum}|${anzahl}|${runde}`;
  const orakel = [(hash(basis + "|orakel") % anzahl) + 1];
  if (zweiAktiv()) {
    let zweites = (hash(basis + "|orakel2") % (anzahl - 1)) + 1;
    if (zweites >= orakel[0]) zweites++;
    orakel.push(zweites);
    orakel.sort((a, b) => a - b);
  }
  const einstellungen = `${themenSchluessel()}|${stand.hinweis ? 1 : 0}|${zweiAktiv() ? 2 : 1}`;
  return {
    frage: FRAGEN[liste[(runde - 1) % liste.length]],
    orakel,
    beginner: (hash(basis + "|start") % anzahl) + 1,
    wort: WOERTER[hash(basis + "|" + einstellungen + "|wort") % WOERTER.length],
  };
}

// ---------- Speichern ----------
function laden() {
  const leer = {
    raum: "", anzahl: 4, nummer: 1, runde: 1, aufgedeckt: 0, imSpiel: false,
    themen: [...THEMEN_IDS], hinweis: false, zweiOrakel: false,
    sprache: (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en",
  };
  try {
    const s = JSON.parse(localStorage.getItem(SPEICHER));
    if (s) {
      const zusammen = Object.assign(leer, s);
      if (typeof zusammen.aufgedeckt === "boolean") zusammen.aufgedeckt = zusammen.aufgedeckt ? 2 : 0;
      if (zusammen.sprache !== "de" && zusammen.sprache !== "en") zusammen.sprache = leer.sprache;
      return zusammen;
    }
  } catch (e) {}
  return leer;
}
function speichern() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) {}
}

const raumBereinigen = (text) => text.toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g, "").slice(0, 12);

let stand = laden();
let karteOffen = false;
let linkRunde = null;

// Einladungslink lesen, z. B. ...#raum=PIZZA&spieler=5&runde=1&themen=sport,party&hinweis=1
(function linkLesen() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.get("raum")) return;
  stand.raum = raumBereinigen(p.get("raum"));
  const n = parseInt(p.get("spieler"), 10);
  if (n >= 3 && n <= 12) stand.anzahl = n;
  const r = parseInt(p.get("runde"), 10);
  linkRunde = r >= 1 ? r : 1;
  const themen = (p.get("themen") || "").split(",").filter((x) => THEMEN_IDS.includes(x));
  stand.themen = themen.length ? themen : [...THEMEN_IDS];
  stand.hinweis = p.get("hinweis") === "1";
  stand.zweiOrakel = p.get("zwei") === "1";
  if (p.get("lang") === "de" || p.get("lang") === "en") stand.sprache = p.get("lang");

  const nr = parseInt(p.get("nummer"), 10);
  if (nr >= 1 && nr <= stand.anzahl) {
    // Link mit fester Spielernummer (z. B. zum Ausprobieren): direkt ins Spiel
    stand.nummer = nr;
    stand.runde = linkRunde;
    stand.aufgedeckt = 0;
    stand.imSpiel = true;
    linkRunde = null;
  } else {
    stand.imSpiel = false;
    if (stand.nummer > stand.anzahl) stand.nummer = 1;
  }
  history.replaceState(null, "", location.pathname + location.search);
})();

// ---------- Anzeige ----------
function texteAnwenden() {
  document.documentElement.lang = stand.sprache;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach((el) => { el.innerHTML = t(el.dataset.tHtml); });
  document.querySelectorAll("[data-t-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.tAria)));
  document.querySelectorAll("[data-t-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.tPlaceholder); });
  document.querySelectorAll("[data-thema]").forEach((b) => { b.textContent = `${THEMEN[b.dataset.thema].emoji} ${themaName(b.dataset.thema)}`; });
  document.querySelectorAll("[data-sprache]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.sprache === stand.sprache));
  aufloesenZuruecksetzen();
}

function zeichnen() {
  $("#startSeite").hidden = stand.imSpiel;
  $("#spielSeite").hidden = !stand.imSpiel;
  if (stand.imSpiel) spielZeichnen(); else startZeichnen();
}

function startZeichnen() {
  if (document.activeElement !== $("#raumFeld")) $("#raumFeld").value = stand.raum;
  $("#anzahl").textContent = stand.anzahl;
  $("#weniger").disabled = stand.anzahl <= 3;
  $("#mehr").disabled = stand.anzahl >= 12;

  const box = $("#nummern");
  box.innerHTML = "";
  for (let i = 1; i <= stand.anzahl; i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = i;
    b.setAttribute("aria-pressed", i === stand.nummer);
    b.setAttribute("aria-label", t("spieler", { n: i }));
    b.onclick = () => { stand.nummer = i; speichern(); startZeichnen(); };
    box.appendChild(b);
  }

  // Einstellungen
  const aktiv = aktiveThemen();
  document.querySelectorAll("[data-thema]").forEach((b) => b.setAttribute("aria-pressed", aktiv.includes(b.dataset.thema)));
  $("#hinweisSchalter").checked = stand.hinweis;
  $("#zweiSchalter").checked = zweiAktiv();
  $("#zweiSchalter").disabled = stand.anzahl < 7;
  $("#zweiText").textContent = stand.anzahl < 7 ? t("zweiErstAb7") : t("zweiWissenNichts");

  const teile = [aktiv.length === THEMEN_IDS.length ? t("alleThemen") : t("anzahlThemen", { n: aktiv.length })];
  if (stand.hinweis) teile.push(t("mitHinweis"));
  if (zweiAktiv()) teile.push(t("zweiOrakelKurz"));
  $("#einstZusammenfassung").textContent = teile.join(" · ");
}

function spielZeichnen() {
  const d = rundeDaten();
  const frage = frageIn(d.frage);
  const binOrakel = d.orakel.includes(stand.nummer);

  $("#raumAnzeige").textContent = t("raum", { raum: stand.raum });
  $("#spielerAnzeige").textContent = t("spielerVon", { n: stand.nummer, m: stand.anzahl });
  $("#kontrollwort").textContent = d.wort;
  $("#rundeAnzeige").textContent = t("runde", { r: stand.runde });
  $("#rundeZurueck").disabled = stand.runde <= 1;

  // Die Karte sieht für alle gleich aus, nur der Text ist anders
  if (binOrakel) {
    $("#karteText").textContent = stand.hinweis
      ? t("orakelKarteHinweis", { h: themaHinweis(d.frage.t), e: frage.e })
      : t("orakelKarte", { e: frage.e });
    $("#karteHinweis").textContent = t("orakelTipp");
  } else {
    $("#karteText").textContent = frage.f;
    $("#karteHinweis").textContent = t("gibAntwort", { e: frage.e });
  }
  $("#spielkarte").classList.toggle("offen", karteOffen);

  $("#beginner").textContent = d.beginner === stand.nummer
    ? t("duFaengstAn")
    : t("spielerFaengtAn", { n: d.beginner });

  // Auflösung in zwei Schritten: erst das Orakel, dann die Frage
  const stufe = stand.aufgedeckt;
  $("#aufloesung").hidden = stufe === 0;
  $("#rundenKnoepfe").hidden = stufe !== 0;
  $("#frageZeigen").hidden = stufe !== 1;
  $("#naechste").hidden = stufe !== 2;
  $("#frageTeil").hidden = stufe !== 2;
  if (stufe > 0) {
    const zwei = d.orakel.length === 2;
    $("#orakelLabel").textContent = zwei ? t("orakelWaren") : t("orakelWar");
    $("#orakelName").textContent = d.orakel
      .map((n) => (n === stand.nummer ? t("du", { n }) : t("spieler", { n })))
      .join(t("und"));
    $("#letzteChance").textContent = zwei ? t("letzteChanceZwei") : t("letzteChance");
    $("#aufFrage").textContent = frage.f;
    $("#aufAntwort").textContent = frage.a;
  }
}

function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 2200);
}

function rundeWechseln(neu) {
  stand.runde = Math.max(1, neu);
  stand.aufgedeckt = 0;
  karteOffen = false;
  aufloesenZuruecksetzen();
  timerSchliessen();
  speichern();
  zeichnen();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---------- Sprache umschalten ----------
document.querySelectorAll("[data-sprache]").forEach((b) => {
  b.onclick = () => {
    stand.sprache = b.dataset.sprache;
    speichern();
    texteAnwenden();
    zeichnen();
  };
});

// ---------- Startseite: Knöpfe ----------
for (const id of THEMEN_IDS) {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.thema = id;
  b.onclick = () => {
    let aktiv = aktiveThemen();
    if (aktiv.includes(id)) {
      if (aktiv.length === 1) { toast(t("mindestensEinThema")); return; }
      aktiv = aktiv.filter((x) => x !== id);
    } else {
      aktiv = [...aktiv, id];
    }
    stand.themen = aktiv;
    speichern();
    startZeichnen();
  };
  $("#themen").appendChild(b);
}
$("#hinweisSchalter").onchange = (e) => { stand.hinweis = e.target.checked; speichern(); startZeichnen(); };
$("#zweiSchalter").onchange = (e) => { stand.zweiOrakel = e.target.checked; speichern(); startZeichnen(); };

$("#raumFeld").addEventListener("input", (e) => {
  const sauber = raumBereinigen(e.target.value);
  if (e.target.value !== sauber) e.target.value = sauber;
  stand.raum = sauber;
  $("#startFehler").hidden = true;
  speichern();
});

$("#raumZufall").onclick = () => {
  stand.raum = WOERTER[Math.floor(Math.random() * WOERTER.length)] + Math.floor(Math.random() * 90 + 10);
  $("#raumFeld").value = stand.raum;
  $("#startFehler").hidden = true;
  speichern();
};

$("#weniger").onclick = () => {
  stand.anzahl = Math.max(3, stand.anzahl - 1);
  if (stand.nummer > stand.anzahl) stand.nummer = stand.anzahl;
  speichern();
  startZeichnen();
};
$("#mehr").onclick = () => {
  stand.anzahl = Math.min(12, stand.anzahl + 1);
  speichern();
  startZeichnen();
};

$("#starten").onclick = () => {
  stand.raum = raumBereinigen($("#raumFeld").value);
  if (!stand.raum) {
    const f = $("#startFehler");
    f.textContent = t("startFehler");
    f.hidden = false;
    const feld = $("#raumFeld");
    feld.classList.remove("wackeln"); void feld.offsetWidth; feld.classList.add("wackeln");
    feld.focus();
    return;
  }
  stand.runde = linkRunde || 1;
  linkRunde = null;
  stand.aufgedeckt = 0;
  stand.imSpiel = true;
  karteOffen = false;
  speichern();
  zeichnen();
  window.scrollTo(0, 0);
};

// ---------- Karte: nur sichtbar, solange man sie festhält ----------
const karte = $("#spielkarte");
function karteZeigen(an) {
  if (karteOffen === an) return;
  karteOffen = an;
  karte.classList.toggle("offen", an);
}
karte.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { karte.setPointerCapture(e.pointerId); } catch (err) {}
  karteZeigen(true);
});
["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) => karte.addEventListener(ev, () => karteZeigen(false)));
karte.addEventListener("contextmenu", (e) => e.preventDefault());
karte.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); karteZeigen(true); }
});
karte.addEventListener("keyup", (e) => {
  if (e.key === " " || e.key === "Enter") karteZeigen(false);
});
karte.addEventListener("blur", () => karteZeigen(false));
document.addEventListener("visibilitychange", () => { if (document.hidden) karteZeigen(false); });

// ---------- Auflösen ----------
let sicherTimer;
function aufloesenZuruecksetzen() {
  clearTimeout(sicherTimer);
  const b = $("#aufloesen");
  b.classList.remove("sicher");
  b.textContent = t("aufloesen");
}
$("#aufloesen").onclick = () => {
  const b = $("#aufloesen");
  if (!b.classList.contains("sicher")) {
    // Erst beim zweiten Tippen auflösen, damit niemand aus Versehen spickt
    b.classList.add("sicher");
    b.textContent = t("sicher");
    clearTimeout(sicherTimer);
    sicherTimer = setTimeout(aufloesenZuruecksetzen, 3000);
    return;
  }
  aufloesenZuruecksetzen();
  stand.aufgedeckt = 1;
  karteZeigen(false);
  speichern();
  spielZeichnen();
};
$("#frageZeigen").onclick = () => { stand.aufgedeckt = 2; speichern(); spielZeichnen(); };

$("#naechste").onclick = () => rundeWechseln(stand.runde + 1);
$("#rundeVor").onclick = () => rundeWechseln(stand.runde + 1);
$("#rundeZurueck").onclick = () => rundeWechseln(stand.runde - 1);

// ---------- Diskussions-Timer ----------
let timerIntervall = null;
let timerEnde = 0;
let letzteSekunde = null;
let countdownSchritte = [];
let audio = null;

function ton(frequenz, dauer = 0.18) {
  try {
    if (!audio) return;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = "sine";
    o.frequency.value = frequenz;
    g.gain.setValueAtTime(0.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dauer);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + dauer + 0.05);
  } catch (e) {}
}
function vibrieren(muster) {
  try { if (navigator.vibrate) navigator.vibrate(muster); } catch (e) {}
}

function timerStarten() {
  // Der Ton muss durch ein Tippen „erlaubt“ werden, deshalb hier vorbereiten
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.resume) audio.resume();
  } catch (e) {}
  timerEnde = Date.now() + DISKUSSION_SEKUNDEN * 1000;
  letzteSekunde = null;
  $("#timer").hidden = false;
  $("#timer").classList.remove("finale");
  $("#timerKnoepfe").hidden = false;
  $("#timerText").textContent = t("diskutiert");
  clearInterval(timerIntervall);
  timerTick();
  timerIntervall = setInterval(timerTick, 200);
}

function timerTick() {
  const rest = Math.max(0, timerEnde - Date.now());
  const sekunden = Math.ceil(rest / 1000);
  $("#timerZahl").textContent = sekunden;
  $("#timerRing").style.setProperty("--p", rest / (DISKUSSION_SEKUNDEN * 1000));
  $("#timerRing").classList.toggle("knapp", sekunden <= 10);
  if (sekunden !== letzteSekunde && sekunden <= 5 && sekunden > 0) ton(440, 0.08);
  letzteSekunde = sekunden;
  if (rest <= 0) countdown();
}

function countdown() {
  clearInterval(timerIntervall);
  countdownSchritte.forEach(clearTimeout);
  countdownSchritte = [];
  $("#timerKnoepfe").hidden = true;
  $("#timerRing").classList.remove("knapp");
  $("#timerRing").style.setProperty("--p", 1);
  $("#timerText").textContent = t("bereit");
  ["3", "2", "1"].forEach((z, i) => {
    countdownSchritte.push(setTimeout(() => { zahlZeigen(z); ton(660); vibrieren(120); }, i * 900));
  });
  countdownSchritte.push(setTimeout(() => {
    zahlZeigen("👉");
    $("#timerText").textContent = t("zeigt");
    $("#timer").classList.add("finale");
    ton(990, 0.5);
    vibrieren([200, 100, 300]);
  }, 3 * 900));
  countdownSchritte.push(setTimeout(timerSchliessen, 3 * 900 + 4000));
}

function zahlZeigen(z) {
  const el = $("#timerZahl");
  el.textContent = z;
  el.classList.remove("plopp");
  void el.offsetWidth;
  el.classList.add("plopp");
}

function timerSchliessen() {
  clearInterval(timerIntervall);
  countdownSchritte.forEach(clearTimeout);
  countdownSchritte = [];
  $("#timer").hidden = true;
  $("#timer").classList.remove("finale");
}

$("#diskussion").onclick = timerStarten;
$("#timerAbbrechen").onclick = timerSchliessen;
$("#timerJetzt").onclick = (e) => { e.stopPropagation(); countdown(); };
$("#timer").addEventListener("click", () => { if ($("#timer").classList.contains("finale")) timerSchliessen(); });

// ---------- Fußleiste ----------
$("#verlassen").onclick = () => {
  stand.imSpiel = false;
  stand.aufgedeckt = 0;
  karteZeigen(false);
  aufloesenZuruecksetzen();
  timerSchliessen();
  speichern();
  zeichnen();
};

$("#einladen").onclick = async () => {
  let url = `${location.origin}${location.pathname}#raum=${encodeURIComponent(stand.raum)}&spieler=${stand.anzahl}&runde=${stand.runde}`;
  const schluessel = themenSchluessel();
  if (schluessel !== "alle") url += `&themen=${schluessel}`;
  if (stand.hinweis) url += "&hinweis=1";
  if (zweiAktiv()) url += "&zwei=1";
  const text = t("einladungText", { raum: stand.raum, n: stand.anzahl });
  if (navigator.share) {
    try { await navigator.share({ title: "Orakel", text, url }); } catch (e) {}
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    toast(t("linkKopiert"));
  } catch (e) {
    toast(t("raumCodeToast", { raum: stand.raum, n: stand.anzahl }));
  }
};

// ---------- Start ----------
texteAnwenden();
zeichnen();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
